# -----------------------------------------------------------------------------
# Site settings — MIRA Lab
# -----------------------------------------------------------------------------

title: <strong>MIRA</strong> Lab
first_name: Jaejin
middle_name:
last_name: Cho
email: jaejincho@sejong.ac.kr
description: > # the "> " allows multi-line values
  Official website of MIRA Lab (Medical Imaging Research and AI Laboratory) at
  Sejong University. Led by Prof. Jaejin Cho. Research on rapid MRI acquisition
  and physics-guided deep learning reconstruction.
footer_fixed: true
lang: en
icon: 🧠

# url and baseurl — UPDATE THESE for your GitHub Pages deployment
url: https://<your-username>.github.io
baseurl: # leave empty for user/organization site (e.g. miralab.github.io)
last_updated: false

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

repo_theme_light: default
repo_theme_dark: dark

# -----------------------------------------------------------------------------
# RSS Feed
# -----------------------------------------------------------------------------

rss_icon: false

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true

# Dimensions
max_width: 930px

# TODO: add favicon
icon: 🧠

# Open Graph & Schema.org
serve_og_meta: true
serve_schema_org: true
og_image: # path/to/og-image.png

# -----------------------------------------------------------------------------
# Social Integration
# -----------------------------------------------------------------------------

github_username:               # your GitHub username (e.g. jaejin-cho)
gitlab_username:
twitter_username:
mastodon_username:
linkedin_username:
scholar_userid:                https://scholar.google.co.kr/citations?user=_jmLTlQAAAAJ&hl=en # your Google Scholar user ID
semanticscholar_id:
publons_id:
research_gate_profile:
blogger_url:
work_url:
wikidata_id:
strava_userid:
keybase_username:
youtube_id:
medium_username:
quora_username:
blogger_url:
work_url:
wikidata_id:
dblp_url:
stackoverflow_id:
kaggle_id:
lastfm_id:
spotify_id:
pinterest_id:
unsplash_id:
instagram_id:
facebook_id:
discord_id:

contact_note: >
  Department of AI and Robotics, Sejong University, Seoul, Korea.

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name: MIRA Lab
blog_description: News and updates from MIRA Lab.
permalink: /blog/:year/:title/
lsi: false

# Pagination
pagination:
  enabled: true

# Comments
disqus_shortname: # disqus shortname (for comments — leave empty to disable)

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/

news_limit: 5

# -----------------------------------------------------------------------------
# Jekyll Settings
# -----------------------------------------------------------------------------

# Markdown and syntax highlight
markdown: kramdown
highlighter: rouge
highlight_theme_light: github
highlight_theme_dark: native
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Includes & excludes
include: ['_pages']
exclude:
  - bin
  - Gemfile
  - Gemfile.lock
  - vendor
keep_files:
  - CNAME
  - .nojekyll
  - .git

# Plug-ins
plugins:
  - jekyll-archives
  - jekyll-diagrams
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-scholar
  - jekyll-sitemap
  - jekyll-twitter-plugin
  - jemoji

# -----------------------------------------------------------------------------
# Jekyll Scholar (Publications)
# -----------------------------------------------------------------------------

scholar:
  last_name: [Cho]
  first_name: [Jaejin, J., J. J.]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"

# Filter out publications
filtered_bibtex_keywords: [abbr, abstract, arxiv, bibtex_show, html, pdf, selected, supp, blog, code, poster, slides, website, preview]

# Bib search
bibtex_search: true

# -----------------------------------------------------------------------------
# Display Options
# -----------------------------------------------------------------------------

enable_project_categories: true
enable_darkmode: true
enable_navbar_social: false
enable_google_analytics: false
enable_panelbear_analytics: false
enable_google_verification: false
enable_bing_verification: false
enable_masonry: true
enable_math: true
enable_tooltips: false
enable_progressbar: true
